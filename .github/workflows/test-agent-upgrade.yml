name: Agent upgrade safety

on:
  push:
    paths:
      - 'agent/**'
      - 'installers/upgrade-agent.sh'
      - 'installers/lib/upgrade-*.cjs'
      - 'installers/install-agent.sh'
      - 'installers/tests/upgrade-agent.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-agent-upgrade.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'installers/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-agent-upgrade.yml'

permissions:
  contents: read

jobs:
  linux-upgrade-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: pnpm
      - name: Install Agent build dependencies without lifecycle hooks
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @plutonhq/pluton-agent...
      - name: Isolated upgrade transaction and Linux filesystem tests
        run: bash installers/tests/upgrade-agent.test.sh
      - name: Compile and test unprivileged Agent including upgrade hold
        env:
          PLUTON_EXCLUSIONS_RESTIC: ${{ runner.temp }}/pluton-exclusion-tools/restic
        # Same approved release/hash as install-agent.sh; no global installation.
        # An unavailable or modified artifact must fail, never skip integration.
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/pluton-exclusion-tools"
          mkdir -p "$tools"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 -o "$tools/restic.bz2"
          printf '%s  %s\n' f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c "$tools/restic.bz2" | sha256sum -c -
          bzip2 -dc "$tools/restic.bz2" > "$tools/restic"
          chmod 0755 "$tools/restic"
          "$tools/restic" version
          pnpm --filter @plutonhq/pluton-agent test
