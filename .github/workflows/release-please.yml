name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Use manifest-based config for monorepo
          # Bootstrap only: remove the package-level release-as after
          # v0.18.0-alpha.1 is released, or update it to a newer one-time target.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
